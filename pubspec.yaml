name: life_os
description: Gamified Life OS - A personal productivity app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  local_auth: ^2.3.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  confetti: ^0.8.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  uuid: ^4.5.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
