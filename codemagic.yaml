workflows:
  ios-release-unsigned:
    name: Build Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Clean build and CocoaPods
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Generate Localizations
        script: |
          flutter gen-l10n
      - name: Run Static Analysis and Tests
        script: |
          flutter analyze
          flutter test --no-pub
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build Unsigned iOS Release
        script: |
          flutter build ios --release --no-codesign
      - name: Package Payload into Unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr app.ipa Payload
          rm -rf Payload
    artifacts:
      - app.ipa
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - developer@example.com
        notify:
          failure: true
          success: true